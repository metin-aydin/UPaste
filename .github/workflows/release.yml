# main dalına her birleştirmede yeni sürüm yayımlanır: sürüm numarası dev/next-version.mjs ile hesaplanır, Linux
# paketleri (AppImage, deb) taslak sürüme yüklenir, hepsi bitince sürüm yayımlanır.
# Sürüm notu birleştirilen PR'ın açıklamasıdır; açıklama boşsa son sürümden bu yana commit başlıkları yazılır.
# Uygulama içi güncelleme yayımlanmış sürümlerdeki latest-linux.yml dosyasını okur.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: echo "version=$(node dev/next-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')
          body=""
          if [ -n "$pr" ]; then
            body=$(gh pr view "$pr" --json body --jq .body | node dev/release-notes.mjs)
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body=$(git log ${last:+$last..}HEAD --no-merges --format='- %s')
          fi
          {
            printf '%s\n' "$body"
            if [ -n "$last" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "$GITHUB_REPOSITORY" "$last" "$VERSION"
            fi
          } > "$RUNNER_TEMP/notes.md"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Yarım kalmış önceki çalıştırmanın taslağı silinir.
          if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "UPaste $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --linux --x64 --publish always

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  discard:
    needs: [prepare, build]
    if: failure() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
